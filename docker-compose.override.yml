services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: src/opplat-react
      dockerfile: Dockerfile.dev
    volumes:
      - ./src/opplat-react:/app
      - /app/node_modules
    ports:
      - "3200:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AUTH_API_URL=http://localhost:8080
      - VITE_SALES_API_URL=http://localhost:8083
      - VITE_INVENTORY_API_URL=http://localhost:8082
      - VITE_AUTH_AUTHORITY=http://localhost:8180/realms/opplat
      - VITE_AUTH_CLIENT_ID=opplat-client
      - VITE_AUTH_AUDIENCE=opplat-api
      - VITE_AUTH_SCOPE=openid profile email offline_access

  admin-frontend:
    build:
      context: src/opplat-admin
      dockerfile: Dockerfile.dev
    volumes:
      - ./src/opplat-admin:/app
      - /app/node_modules
    ports:
      - "3201:3201"
    environment:
      - VITE_DEV_PROXY_TARGET=http://admin-api:8080
      - VITE_ADMIN_API_URL=http://localhost:8084

