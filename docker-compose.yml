services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opplat-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-Admin123*}
      - MSSQL_PID=Developer
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD:-Admin123*}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opplat-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: opplat-keycloak
    command: start-dev --import-realm --hostname=http://localhost:${KEYCLOAK_PORT:-8180} --hostname-backchannel-dynamic=true
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - type: bind
        source: ./docker/keycloak/keycloak.conf
        target: /opt/keycloak/conf/keycloak.conf
        read_only: true
      - type: bind
        source: ./docker/keycloak/opplat-realm.json
        target: /opt/keycloak/data/import/opplat-realm.json
        read_only: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/${KEYCLOAK_REALM:-opplat}/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - opplat-network

  api:
    build:
      context: .
      dockerfile: src/Opplat.MainApp/Dockerfile
    container_name: opplat-api
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - ConnectionStrings__MainConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Auth__Authority=${AUTH__AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/${KEYCLOAK_REALM:-opplat}}
      - Auth__MetadataAddress=${AUTH__METADATA_ADDRESS:-http://keycloak:8180/realms/${KEYCLOAK_REALM:-opplat}/.well-known/openid-configuration}
      - Auth__Audience=${AUTH__AUDIENCE:-opplat-api}
      - Auth__ClientIdClient=${AUTH__CLIENT_ID_CLIENT:-opplat-client}
      - Auth__ClientIdAdmin=${AUTH__CLIENT_ID_ADMIN:-opplat-admin}
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Id=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Identifier=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Name=MojoCafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__ConnectionString=Server=sqlserver,1433;Database=opplat-mojocafe;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Id=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Identifier=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Name=Demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__ConnectionString=Server=sqlserver,1433;Database=opplat-demo;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Id=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Identifier=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Name=Test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__ConnectionString=Server=sqlserver,1433;Database=opplat-test;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /docs/v1/docs.json HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opplat-network

  sales-api:
    build:
      context: .
      dockerfile: src/Services/Sales/Opplat.Services.Sales.Api/Dockerfile
    container_name: opplat-sales-api
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${SALES_API_PORT:-8083}:8080"
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - ConnectionStrings__MainConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Auth__Authority=${AUTH__AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/${KEYCLOAK_REALM:-opplat}}
      - Auth__MetadataAddress=${AUTH__METADATA_ADDRESS:-http://keycloak:8180/realms/${KEYCLOAK_REALM:-opplat}/.well-known/openid-configuration}
      - Auth__Audience=${AUTH__AUDIENCE:-opplat-api}
      - Auth__ClientIdClient=${AUTH__CLIENT_ID_CLIENT:-opplat-client}
      - Auth__ClientIdAdmin=${AUTH__CLIENT_ID_ADMIN:-opplat-admin}
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Id=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Identifier=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Name=MojoCafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__ConnectionString=Server=sqlserver,1433;Database=opplat-mojocafe;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Id=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Identifier=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Name=Demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__ConnectionString=Server=sqlserver,1433;Database=opplat-demo;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Id=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Identifier=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Name=Test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__ConnectionString=Server=sqlserver,1433;Database=opplat-test;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Documentation__Title=Opplat Sales Service
      - Documentation__Description=Sales microservice API
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opplat-network

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/Opplat.Services.Inventory.Api/Dockerfile
    container_name: opplat-inventory-api
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${INVENTORY_API_PORT:-8082}:8080"
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - ConnectionStrings__MainConnection=Server=sqlserver,1433;Database=opplat-main;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Auth__Authority=${AUTH__AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/${KEYCLOAK_REALM:-opplat}}
      - Auth__MetadataAddress=${AUTH__METADATA_ADDRESS:-http://keycloak:8180/realms/${KEYCLOAK_REALM:-opplat}/.well-known/openid-configuration}
      - Auth__Audience=${AUTH__AUDIENCE:-opplat-api}
      - Auth__ClientIdClient=${AUTH__CLIENT_ID_CLIENT:-opplat-client}
      - Auth__ClientIdAdmin=${AUTH__CLIENT_ID_ADMIN:-opplat-admin}
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Id=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Identifier=mojocafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__Name=MojoCafe
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__0__ConnectionString=Server=sqlserver,1433;Database=opplat-mojocafe;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Id=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Identifier=demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__Name=Demo
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__1__ConnectionString=Server=sqlserver,1433;Database=opplat-demo;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Id=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Identifier=test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__Name=Test
      - Finbuckle__MultiTenant__Stores__ConfigurationStore__Tenants__2__ConnectionString=Server=sqlserver,1433;Database=opplat-test;User Id=sa;Password=${SA_PASSWORD:-Admin123*};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Documentation__Title=Opplat Inventory Service
      - Documentation__Description=Inventory microservice API
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opplat-network

  frontend:
    build:
      context: src/opplat-react
      dockerfile: Dockerfile
    container_name: opplat-frontend
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
      sales-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:${API_PORT:-8080}}
      - VITE_AUTH_API_URL=${VITE_AUTH_API_URL:-http://localhost:${API_PORT:-8080}}
      - VITE_SALES_API_URL=${VITE_SALES_API_URL:-http://localhost:${SALES_API_PORT:-8083}}
      - VITE_INVENTORY_API_URL=${VITE_INVENTORY_API_URL:-http://localhost:${INVENTORY_API_PORT:-8082}}
      - VITE_AUTH_AUTHORITY=${VITE_AUTH_AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/${KEYCLOAK_REALM:-opplat}}
      - VITE_AUTH_CLIENT_ID=${VITE_AUTH_CLIENT_ID:-opplat-client}
      - VITE_AUTH_AUDIENCE=${VITE_AUTH_AUDIENCE:-opplat-api}
      - VITE_AUTH_SCOPE=${VITE_AUTH_SCOPE:-openid profile email offline_access}
    networks:
      - opplat-network

  admin-frontend:
    build:
      context: src/opplat-admin
      dockerfile: Dockerfile
    container_name: opplat-admin-frontend
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_FRONTEND_PORT:-3101}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:${API_PORT:-8080}}
      - VITE_AUTH_AUTHORITY=${VITE_ADMIN_AUTH_AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/${KEYCLOAK_REALM:-opplat}}
      - VITE_AUTH_CLIENT_ID=${VITE_ADMIN_AUTH_CLIENT_ID:-opplat-admin}
      - VITE_AUTH_AUDIENCE=${VITE_ADMIN_AUTH_AUDIENCE:-opplat-api}
      - VITE_AUTH_SCOPE=${VITE_ADMIN_AUTH_SCOPE:-openid profile email offline_access}
    networks:
      - opplat-network

volumes:
  sqlserver_data:
    driver: local

networks:
  opplat-network:
    driver: bridge
